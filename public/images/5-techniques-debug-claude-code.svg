<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" fill="none">
  <defs>
    <style>
      text { font-family: 'SF Mono', 'Menlo', 'Monaco', monospace; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="420" fill="#0a0a0a"/>

  <!-- Title bar -->
  <rect width="800" height="36" fill="#2a2a2a"/>
  <circle cx="20" cy="18" r="5.5" fill="#ff5f57"/>
  <circle cx="38" cy="18" r="5.5" fill="#ffbd2e"/>
  <circle cx="56" cy="18" r="5.5" fill="#28c840"/>

  <!-- Claude Code pixel robot - traced from 40x40 grid, 5px per unit -->
  <!-- Robot spans cols 5-34 (30 wide), rows 9-33 (25 tall) -->
  <!-- Centered: 30*5=150px wide, start x = 400-75 = 325 -->
  <!-- Claude Code robot as a single path, no seams -->
  <path transform="translate(325, 85)" fill="#d4845a" fill-rule="evenodd" d="
    M0 0 h150 v50 h25 v25 h-25 v25 h-150 v-25 h-25 v-25 h25 z
    M10 100 h12 v25 h-12 z
    M32 100 h12 v25 h-12 z
    M105 100 h12 v25 h-12 z
    M127 100 h12 v25 h-12 z
    M25 25 h15 v25 h-15 z
    M110 25 h15 v25 h-15 z
  "/>

  <!-- Title -->
  <text x="400" y="270" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">5 Techniques to Debug Claude Code</text>

  <!-- Subtitle -->
  <text x="400" y="300" text-anchor="middle" fill="#5a5750" font-size="14">The problem is context, not intelligence.</text>

  <!-- Footer -->
  <line x1="0" y1="360" x2="800" y2="360" stroke="#1a1a1a" stroke-width="1"/>
  <text x="40" y="383" fill="#3a3a3a" font-size="11">Opus 4.6 (1M context)</text>
  <text x="195" y="383" fill="#2a2a2a" font-size="11">|</text>
  <text x="210" y="383" fill="#3a3a3a" font-size="11">ctx:</text>
  <rect x="238" y="376" width="24" height="6" rx="1" fill="#5a5750"/>
  <rect x="264" y="376" width="40" height="6" rx="1" fill="#2a2a2a"/>
  <text x="310" y="383" fill="#3a3a3a" font-size="11">19%</text>
  <text x="340" y="383" fill="#2a2a2a" font-size="11">|</text>
  <text x="355" y="383" fill="#3a3a3a" font-size="11">~/my-project</text>
  <text x="40" y="403" fill="#e8915a" font-size="11">▸▸</text>
  <text x="62" y="403" fill="#3a3a3a" font-size="11">bypass permissions on (shift+tab to cycle)</text>
</svg>
