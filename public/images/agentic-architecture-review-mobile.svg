<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1840" viewBox="0 0 640 1840" role="img" aria-labelledby="title desc">
  <title id="title">Agentic Architecture Review Claude Code Skill</title>
  <desc id="desc">Mobile infographic showing how to install the skill and the ten architecture areas it reviews.</desc>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1E2A4A"/><stop offset="1" stop-color="#2E6971"/></linearGradient>
    <style>
      .display { font-family: Avenir, "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: Menlo, Monaco, monospace; }
      .card-title { font: 700 26px Avenir, "Helvetica Neue", Arial, sans-serif; fill: #1E2A4A; }
      .card-copy { font: 500 22px Avenir, "Helvetica Neue", Arial, sans-serif; fill: #565D5B; }
      .num { font: 700 18px Menlo, Monaco, monospace; fill: #B85E3D; }
    </style>
  </defs>
  <rect width="640" height="1840" fill="#F7F3EA"/>
  <circle cx="620" cy="-20" r="155" fill="#DDEDEF"/><circle cx="665" cy="28" r="92" fill="#F5D8CA"/>

  <rect x="32" y="32" width="174" height="46" rx="23" fill="#DDEDEF"/>
  <text x="119" y="62" text-anchor="middle" class="display" font-size="18" font-weight="700" letter-spacing="1.8" fill="#35656E">CLAUDE SKILL</text>
  <text x="608" y="57" text-anchor="end" class="display" font-size="19" font-weight="700" fill="#1E2A4A">ALLIE JONES</text>

  <text class="display" font-size="48" font-weight="700" letter-spacing="-1.3" fill="#1E2A4A">
    <tspan x="32" y="142">Agentic Architecture</tspan>
    <tspan x="32" y="198" fill="#35656E">Review Claude Code Skill</tspan>
  </text>

  <g transform="translate(32 242)">
    <rect width="576" height="174" rx="22" fill="url(#hero)"/>
    <text x="28" y="42" class="display" font-size="17" font-weight="700" letter-spacing="1.5" fill="#A9DADB">INSTALL IN CLAUDE CODE</text>
    <text class="mono" font-size="23" font-weight="700" fill="#FFFFFF">
      <tspan x="28" y="86">/plugin marketplace add</tspan>
      <tspan x="28" y="128">allierays/agentic-architecture-review</tspan>
    </text>
  </g>

  <text x="32" y="472" class="display" font-size="21" font-weight="700" letter-spacing="2.3" fill="#35656E">WHAT IT REVIEWS</text>
  <path d="M250 464H608" stroke="#D8D3C8" stroke-width="2"/>

  <g transform="translate(32 500)"><rect width="576" height="122" rx="17" fill="#FFFFFF" stroke="#E1DDD3"/><rect width="8" height="122" rx="4" fill="#35656E"/><text x="26" y="38" class="num">01</text><text x="75" y="39" class="card-title">REAL SYSTEM</text><text class="card-copy"><tspan x="26" y="78">Checks docs and diagrams against code,</tspan><tspan x="26" y="105">dependencies, and deployment.</tspan></text></g>
  <g transform="translate(32 628)"><rect width="576" height="122" rx="17" fill="#FFFFFF" stroke="#E1DDD3"/><rect width="8" height="122" rx="4" fill="#B85E3D"/><text x="26" y="38" class="num">02</text><text x="75" y="39" class="card-title">TOPOLOGY</text><text class="card-copy"><tspan x="26" y="78">Labels every component and asks whether</tspan><tspan x="26" y="105">each agent is justified.</tspan></text></g>
  <g transform="translate(32 756)"><rect width="576" height="122" rx="17" fill="#FFFFFF" stroke="#E1DDD3"/><rect width="8" height="122" rx="4" fill="#D4B44A"/><text x="26" y="38" class="num">03</text><text x="75" y="39" class="card-title">AUTONOMY</text><text class="card-copy"><tspan x="26" y="78">Matches freedom to verifiability and</tspan><tspan x="26" y="105">requires evidence for agents.</tspan></text></g>
  <g transform="translate(32 884)"><rect width="576" height="122" rx="17" fill="#FFFFFF" stroke="#E1DDD3"/><rect width="8" height="122" rx="4" fill="#35656E"/><text x="26" y="38" class="num">04</text><text x="75" y="39" class="card-title">INFRASTRUCTURE</text><text class="card-copy"><tspan x="26" y="78">Flags retries, checkpoints, or tracing</tspan><tspan x="26" y="105">your runtime already provides.</tspan></text></g>
  <g transform="translate(32 1012)"><rect width="576" height="122" rx="17" fill="#FFFFFF" stroke="#E1DDD3"/><rect width="8" height="122" rx="4" fill="#B85E3D"/><text x="26" y="38" class="num">05</text><text x="75" y="39" class="card-title">DATA + MEMORY</text><text class="card-copy"><tspan x="26" y="78">Checks sources of truth, provenance,</tspan><tspan x="26" y="105">stale data, and memory cost.</tspan></text></g>
  <g transform="translate(32 1140)"><rect width="576" height="122" rx="17" fill="#FFFFFF" stroke="#E1DDD3"/><rect width="8" height="122" rx="4" fill="#D4B44A"/><text x="26" y="38" class="num">06</text><text x="75" y="39" class="card-title">RUNTIME SAFETY</text><text class="card-copy"><tspan x="26" y="78">Reviews checkpoints, idempotent writes,</tspan><tspan x="26" y="105">and restart-safe approvals.</tspan></text></g>
  <g transform="translate(32 1268)"><rect width="576" height="122" rx="17" fill="#FFFFFF" stroke="#E1DDD3"/><rect width="8" height="122" rx="4" fill="#35656E"/><text x="26" y="38" class="num">07</text><text x="75" y="39" class="card-title">PERMISSIONS</text><text class="card-copy"><tspan x="26" y="78">Checks enforced scope, untrusted content,</tspan><tspan x="26" y="105">and approval before writes.</tspan></text></g>
  <g transform="translate(32 1396)"><rect width="576" height="122" rx="17" fill="#FFFFFF" stroke="#E1DDD3"/><rect width="8" height="122" rx="4" fill="#B85E3D"/><text x="26" y="38" class="num">08</text><text x="75" y="39" class="card-title">TRACING</text><text class="card-copy"><tspan x="26" y="78">Follows model calls, tools, retries,</tspan><tspan x="26" y="105">and approvals in one trace.</tspan></text></g>
  <g transform="translate(32 1524)"><rect width="576" height="122" rx="17" fill="#FFFFFF" stroke="#E1DDD3"/><rect width="8" height="122" rx="4" fill="#D4B44A"/><text x="26" y="38" class="num">09</text><text x="75" y="39" class="card-title">GOLDEN DATASET</text><text class="card-copy"><tspan x="26" y="78">Looks for frozen evidence, labeled cases,</tspan><tspan x="26" y="105">edge cases, and holdouts.</tspan></text></g>
  <g transform="translate(32 1652)"><rect width="576" height="122" rx="17" fill="#FFFFFF" stroke="#E1DDD3"/><rect width="8" height="122" rx="4" fill="#35656E"/><text x="26" y="38" class="num">10</text><text x="75" y="39" class="card-title">EVALS</text><text class="card-copy"><tspan x="26" y="78">Reviews component, workflow, and security</tspan><tspan x="26" y="105">evals plus release gates.</tspan></text></g>
</svg>
