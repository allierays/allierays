<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Storylane QA Agent Architecture</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@xyflow/react@12/dist/umd/index.js"></script>
<link href="https://unpkg.com/@xyflow/react@12/dist/style.css" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body, #root { width: 100%; height: 100%; background: #fafaf7; }
  .react-flow__node {
    font-family: 'Source Serif 4', Georgia, serif;
  }
  .react-flow__attribution { display: none; }
  .node-card {
    background: #ffffff;
    border: 1.5px solid #e8e5dd;
    border-radius: 10px;
    padding: 14px 20px;
    text-align: center;
    min-width: 220px;
    box-shadow: 0 2px 8px rgba(26, 25, 21, 0.06);
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .node-card:hover {
    border-color: #d4b44a;
    box-shadow: 0 4px 16px rgba(26, 25, 21, 0.1);
  }
  .node-card.input-node {
    background: #1e2a4a;
    border-color: #1e2a4a;
  }
  .node-card.input-node .node-title {
    color: #ffffff;
  }
  .node-card.input-node .node-subtitle {
    color: rgba(255, 255, 255, 0.7);
  }
  .node-card.output-node {
    background: linear-gradient(135deg, #1e2a4a 0%, #2a3a5a 100%);
    border-color: #d4b44a;
    border-width: 2px;
  }
  .node-card.output-node .node-title {
    color: #d4b44a;
  }
  .node-card.output-node .node-subtitle {
    color: rgba(255, 255, 255, 0.7);
  }
  .node-title {
    font-family: 'Source Serif 4', Georgia, serif;
    font-weight: 600;
    font-size: 15px;
    color: #1a1915;
    line-height: 1.3;
  }
  .node-subtitle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: #8a867a;
    margin-top: 4px;
    letter-spacing: 0.02em;
  }
  .react-flow__edge-path {
    stroke: #b8960c !important;
    stroke-width: 2 !important;
  }
  .react-flow__arrowhead polyline {
    stroke: #b8960c !important;
    fill: #b8960c !important;
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
<div id="root"></div>
<script>
const { createElement: h } = React;
const { ReactFlow, Background, MarkerType } = window.xyflow;

const CustomNode = ({ data }) => {
  return h('div', { className: `node-card ${data.variant || ''}` },
    h('div', { className: 'node-title' }, data.label),
    data.subtitle && h('div', { className: 'node-subtitle' }, data.subtitle)
  );
};

const nodeTypes = { custom: CustomNode };

const nodes = [
  {
    id: '1',
    type: 'custom',
    position: { x: 250, y: 0 },
    data: { label: 'Storylane URL', subtitle: 'demo input', variant: 'input-node' },
  },
  {
    id: '2',
    type: 'custom',
    position: { x: 250, y: 110 },
    data: { label: 'Playwright', subtitle: 'async scraping \u00b7 iframe handling' },
  },
  {
    id: '3',
    type: 'custom',
    position: { x: 250, y: 220 },
    data: { label: 'Step Parser', subtitle: 'chapter tracking \u00b7 content extraction' },
  },
  {
    id: '4',
    type: 'custom',
    position: { x: 250, y: 330 },
    data: { label: 'GPT Analysis', subtitle: 'per-step review against QA rubric' },
  },
  {
    id: '5',
    type: 'custom',
    position: { x: 250, y: 440 },
    data: { label: 'Scored Report', subtitle: 'quality metrics \u00b7 recommendations', variant: 'output-node' },
  },
];

const edges = [
  { id: 'e1-2', source: '1', target: '2', markerEnd: { type: MarkerType.ArrowClosed, color: '#b8960c' }, style: { stroke: '#b8960c', strokeWidth: 2 }, animated: true },
  { id: 'e2-3', source: '2', target: '3', markerEnd: { type: MarkerType.ArrowClosed, color: '#b8960c' }, style: { stroke: '#b8960c', strokeWidth: 2 }, animated: true },
  { id: 'e3-4', source: '3', target: '4', markerEnd: { type: MarkerType.ArrowClosed, color: '#b8960c' }, style: { stroke: '#b8960c', strokeWidth: 2 }, animated: true },
  { id: 'e4-5', source: '4', target: '5', markerEnd: { type: MarkerType.ArrowClosed, color: '#b8960c' }, style: { stroke: '#b8960c', strokeWidth: 2 }, animated: true },
];

function App() {
  return h(ReactFlow, {
    nodes,
    edges,
    nodeTypes,
    fitView: true,
    fitViewOptions: { padding: 0.3 },
    zoomOnScroll: false,
    zoomOnPinch: false,
    panOnScroll: false,
    panOnDrag: false,
    preventScrolling: false,
    nodesDraggable: false,
    nodesConnectable: false,
    elementsSelectable: false,
    proOptions: { hideAttribution: true },
  },
    h(Background, { color: '#e8e5dd', gap: 20, size: 1 })
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
