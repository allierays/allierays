name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; let a newer push supersede an in-flight one.
concurrency:
  group: deploy-main
  cancel-in-progress: true

permissions:
  id-token: write   # required to request the OIDC token
  contents: read

env:
  AWS_REGION: us-east-1
  S3_BUCKET: allierays-site
  CLOUDFRONT_ID: E3932KOEPA4WGH

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::647231754715:role/allierays-site-deploy
          aws-region: ${{ env.AWS_REGION }}

      # Content-hashed assets first, so freshly-uploaded HTML never points at
      # a file that isn't in the bucket yet. Safe to cache forever.
      - name: Sync hashed assets (immutable)
        run: |
          aws s3 sync dist/ "s3://$S3_BUCKET" --delete \
            --exclude "*" --include "_astro/*" --include "fonts/*" \
            --cache-control "public,max-age=31536000,immutable"

      # Everything else — HTML, sitemap, rss, images. Must revalidate or
      # changes never surface. --delete honours these same filters, so this
      # pass prunes stale pages without touching the assets above.
      - name: Sync pages and the rest (revalidate)
        run: |
          aws s3 sync dist/ "s3://$S3_BUCKET" --delete \
            --exclude "_astro/*" --exclude "fonts/*" \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          id=$(aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_ID" --paths '/*' \
            --query 'Invalidation.Id' --output text)
          echo "invalidation $id"
          aws cloudfront wait invalidation-completed \
            --distribution-id "$CLOUDFRONT_ID" --id "$id"
          echo "### Deployed to https://allierays.com" >> "$GITHUB_STEP_SUMMARY"
